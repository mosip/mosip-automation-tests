# Shared secret required (as X-Api-Key header) to call sensitive packet-creator endpoints
# (actuator info, packet create/sync, resident update, card download). Must be overridden
# per environment (e.g. via MOSIP_TEST_PACKETCREATOR_APIKEY); left blank here disables the
# check so existing deployments are not broken until the secret is provisioned.
mosip.test.packetcreator.apikey=


