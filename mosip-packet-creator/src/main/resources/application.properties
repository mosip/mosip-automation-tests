server.port=8080
mosip.kernel.keymanager.certificate-file-path=classpath:cert/mosipio.crt
mosip.kernel.keymanager.privatekey-file-path=classpath:cert/mosipio.key
mosip.kernel.keymanager.certificate-type=X509
########################################################################################
#Swagger 3.0 open api
openapi.info.title=Packet Creator
openapi.info.description=DSL Rig Packet Creator — build/sync MOSIP registration packets and manage test context
openapi.info.version=1.0
openapi.info.license.name=Mosip
openapi.info.license.url=https://docs.mosip.io/platform/license
mosipbox.public.url=http://localhost:${server.port}
openapi.service.servers[0].url=${mosipbox.public.url}${server.servlet.context-path}
openapi.service.servers[0].description=Packet Creator (local)
openapi.group.name=${openapi.info.title}
openapi.group.paths[0]=/**
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.syntaxHighlight.activated=true
springdoc.swagger-ui.doc-expansion=list
springdoc.swagger-ui.default-models-expand-depth=2
springdoc.swagger-ui.default-model-expand-depth=2
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-operation-id=false
springdoc.show-actuator=false
springdoc.override-with-generic-response=false
########################################################################################
logging.level.web=DEBUG
logging.level.org.springframework.web=DEBUG
spring.mvc.log-request-details=true
