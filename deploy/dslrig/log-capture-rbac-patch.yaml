# Apply on cluster when DSL orchestrator log capture returns Forbidden on deployments/logs.
# ServiceAccount: dslrig/dslorchestrator (adjust namespace/name if different).
#
#   kubectl apply -f deploy/dslrig/log-capture-rbac-patch.yaml
#
# After helm upgrade, this is included in helm/dslorchestrator ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dslorchestrator-dslrig-log-capture
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "patch", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dslorchestrator-dslrig-log-capture
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dslorchestrator-dslrig-log-capture
subjects:
  - kind: ServiceAccount
    name: dslorchestrator
    namespace: dslrig
