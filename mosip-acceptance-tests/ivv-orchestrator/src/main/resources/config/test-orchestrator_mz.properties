partnerDemoServiceBaseUrl=http://localhost:8384

# wait time in milliseconds for packet processing and credential issuance, for 1 loop
waitTime = 5000
parentPacketProcessWaitTime = 120000
# loop count: max poll iterations (5 sec x 80 = ~6m40s sleep-only upper bound)
loopCount = 80
# Optional tighter retry budgets for packet template/sync (blank = use loopCount)
packetTemplateRetryCount=5
packetSyncRetryCount=3
# hard wall-clock cap for checkStatus per RID (ms); polling stops when exceeded regardless of API latency
maxPacketStatusWaitTimeMs = 600000
# per status API call socket timeout (ms); keeps slow responses from extending total wait beyond maxPacketStatusWaitTimeMs
packetStatusSocketTimeoutMs = 15000
maxAttempts=1
