# =============================================================================
# TEST EXECUTION — which scenarios run, parallelism, and suite time limits
# Change: scenariosToExecute / scenariosToSkip / scenariosFlowToExecute for
#         your run; threadCount and maxSuiteTime for load and timeout (hours).
# =============================================================================
scenariosToExecute=59
scenariosToSkip=
scenariosFlowToExecute=
threadCount=8
maxSuiteTime=3

# =============================================================================
# REPORTING — HTML report options and optional S3 upload
# Change: reportPayloadMaxChars (0 = no limit); push-reports-to-s3 and S3 keys if
#         uploading reports (S3 settings may be in other config if present).
# =============================================================================
reportPayloadMaxChars=8192
push-reports-to-s3 = no

# =============================================================================
# SCENARIO SHEETS & EXTERNAL DATA — Excel/sheet source and local mount paths
# Change: useExternalScenarioSheet; mountPath / mountPathForScenario to match
#         your machine and where scenario JSON/Excel lives.
# useGherkinScenarios=yes loads config/scenarios.feature directly (no CSV/JSON).
# =============================================================================
useExternalScenarioSheet=no
useGherkinScenarios=yes
mountPath=../mountvolume
mountPathForScenario=D:/centralized/mountvolume

# =============================================================================
# PACKET UTILITY — base URL for packet-creator / utility service (local or env)
# Change: packetUtilityBaseUrl host/port when utility runs elsewhere.
# =============================================================================
packetUtilityBaseUrl=http://localhost:8080/v1/packetcreator

# =============================================================================
# PERSONA / TEST DATA PATHS — classpath-relative biometric and document data
# Change: only if your profile_resource layout differs from defaults.
# =============================================================================
mosip.test.persona.datapath=/profile_resource/
mosip.test.persona.fingerprintdatapath=/profile_resource/fp_data
mosip.test.persona.irisdatapath=/profile_resource/iris_data/
mosip.test.persona.locationsdatapath=/profile_resource/location_data
mosip.test.persona.namesdatapath=/profile_resource/names_data
mosip.test.persona.facedatapath=/profile_resource/face_data
mosip.test.persona.documentsdatapath=/profile_resource/documents_data/templates/
mosip.test.persona.largedocumentpath=/profile_resource/documents_data/
mosip.test.persona.templatesdatapath=/profile_resource/templates_data
mosip.test.temp=/packets/
templateIDMeta=/profile_resource/templates_data/IDMetaInfo.json

# =============================================================================
# OTP & EMAIL — skip live OTP when testing; set target email if needed
# Change: usePreConfiguredOtp=true and preconfiguredOtp / email_otp for fixed
#         OTP; otpTargetEmail when driving real email flows.
# =============================================================================
usePreConfiguredOtp=false
usePreConfiguredEmail=
otpTargetEmail=
preconfiguredOtp=111111
email_otp=111111

# =============================================================================
# PREREGISTRATION — API path suffixes and registration center for prereg tests
# Change: mosip.test.prereg.centerid to a valid center in target environment.
# =============================================================================
uploaddocument=preregistration/v1/documents/
updatePreRegStatus=preregistration/v1/applications/prereg/status/
mosip.test.prereg.centerid=10005
preregSendOtp = /preregistration/v1/login/sendOtp/langcode
preregValidateOtp = /preregistration/v1/login/validateOtp

# =============================================================================
# REGISTRATION PROCESSOR & AUDIT — RID status, DB schema, wait tuning
# Change: audit_db_schema if audit DB name differs; uinWaitTime /
#         nextPacketUploadWaitTime when tests need longer waits (milliseconds).
# =============================================================================
ridStageStatus=v1/admin/packetstatusupdate
audit_db_schema=regprc
uinWaitTime=
nextPacketUploadWaitTime=

# =============================================================================
# ACTUATOR & ESIGNET — health/env endpoints and property file section names
# Change: paths if service context paths differ on your MOSIP deployment.
# =============================================================================
regprocActuatorEndpoint=/registrationprocessor/v1/registrationtransaction/actuator/env
actuatorRegprocEndpoint=/registrationprocessor/v1/registrationtransaction/actuator/env
esignetActuatorPropertySection=esignet-default.properties

# =============================================================================
# DEBUG, LOGGING & NOTIFICATIONS — verbosity and notification checks
# Change: enableDebug / internalApiLogging for troubleshooting; checkNotification
#         when validating notification flows against the environment.
# =============================================================================
enableDebug=yes
internalApiLogging=yes
checkNotification=no

# =============================================================================
# ADMIN USER & ROLES — default admin login and role list for setup scenarios
# Change: admin_userName, admin_password, admin_zone_appid, and roles to match
#         your Keycloak/admin users in the target environment.
# =============================================================================
