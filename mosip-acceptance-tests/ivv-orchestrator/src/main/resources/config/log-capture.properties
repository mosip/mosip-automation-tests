# Kubernetes/Rancher service log capture during DSL execution.
# Use logCapture.targets with namespace:workload (matches Rancher namespace + deployment name).
# Env vars override these keys. See helm dslorchestrator.configmaps.logCapture.

logCapture.enabled=true
logCapture.namespace=mosip
logCapture.captureMode=execution-window
logCapture.localLogPath=reports/logs
logCapture.uploadToS3=true
logCapture.s3.enabled=true
logCapture.s3.provider=minio
logCapture.s3.bucketName=
logCapture.s3.reportFolder=execution-logs
logCapture.s3.uploadCombinedLog=true
logCapture.s3.uploadServiceWiseLogs=true
logCapture.s3.compressBeforeUpload=true

# Multi-namespace targets (dev01 / Rancher layout). Format: namespace:deployment-name
logCapture.targets=regproc:regproc-camel,regproc:regproc-group1,regproc:regproc-group2,regproc:regproc-group3,regproc:regproc-group4,regproc:regproc-group5,regproc:regproc-group6,regproc:regproc-group7,regproc:regproc-landingzone,regproc:regproc-notifier,regproc:regproc-pktserver,regproc:regproc-reprocess,regproc:regproc-status,regproc:regproc-trans,regproc:regproc-workflow,packetmanager:packetmanager,abis:mock-abis,abis:mock-mv,mosip:resident-service,mosip:id-repository,mosip:keycloak,mosip:mock-smtp,mosip:kafka,mosip:registration-processor,mosip:regproc-packet-receiver,mosip:regproc-packet-uploader,mosip:regproc-credential-request-generator,mosip:regproc-credential-request-processor,mosip:regproc-print-service,mosip:regproc-manual-verification,mosip:biosdk-service

# Legacy single-namespace list (used only when logCapture.targets is empty)
logCapture.services=packet-manager,resident-service,id-repository,keycloak,mock-smtp,kafka
logCapture.excludeServices=nginx,monitoring,istio,prometheus,istio-proxy
logCapture.logLevels=INFO,WARN,ERROR
logCapture.generateCombinedLog=true
logCapture.generateFailureSummary=true
logCapture.kubectlTimeoutSeconds=300
logCapture.maxLogBytesPerService=52428800
